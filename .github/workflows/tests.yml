name: CPU tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch>=2.6,<2.15' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,data]'
      - name: Run tests
        run: python -m pytest -q
      - name: Inspect full-size model without allocating weights
        run: python -m v41_mini.inspect --config configs/v41_text_mini_500m.json
      - name: Check shell launchers
        run: bash -n scripts/launch_4x4090.sh scripts/launch_sft_4gpu.sh scripts/launch_pretrain_budgeted.sh
